name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Phase 4D-5 operational tests
        run: npm run test:phase4d-5

      - name: Phase 4E-1 offline model tests
        run: npm run test:phase4e-1

      - name: Phase 4E-2 snapshot sync tests
        run: npm run test:phase4e-2

      - name: Build
        run: npm run build
