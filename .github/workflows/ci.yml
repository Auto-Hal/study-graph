name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Phase 4D-5 operational tests
        run: npm run test:phase4d-5

      - name: Phase 4D-2 Objective persistence tests
        run: npm run test:phase4d-2

      - name: Pilot regression tests
        run: npm run test:pilot

      - name: Objective rawAnswer contract regression tests
        run: npm run test:objective-raw-answer-fix

      - name: Phase 4E-1 offline model tests
        run: npm run test:phase4e-1

      - name: Phase 4E-2 snapshot sync tests
        run: npm run test:phase4e-2

      - name: Phase 4E-3 snapshot distribution tests
        run: npm run test:phase4e-3

      - name: Phase 4E-4 durable attempt outbox tests
        run: npm run test:phase4e-4

      - name: Phase 4E-5 offline prefetch and asset tests
        run: npm run test:phase4e-5

      - name: Phase 4E-6 final offline hardening tests
        run: npm run test:phase4e-6

      - name: Phase 5A-0 UI contract tests
        run: npm run test:phase5a-0

      - name: Phase 5A-0-3c project workspace parity tests
        run: npm run test:phase5a-0-3c

      - name: Phase 5A-0-4a-1 shared read contract tests
        run: npm run test:phase5a-0-4a-1

      - name: Phase 5A-0-4a-2 project snapshot publisher tests
        run: npm run test:phase5a-0-4a-2

      - name: Phase 5A-0-4a-3 snapshot read cutover tests
        run: npm run test:phase5a-0-4a-3

      - name: Phase 5A-0-4a-4 Kuzushiji v2 projection tests
        run: npm run test:phase5a-0-4a-4

      - name: Phase 5A-0-4a-5 Kuzushiji snapshot read cutover tests
        run: npm run test:phase5a-0-4a-5

      - name: Phase 5A-0-4a-6 shared foreground refresh tests
        run: npm run test:phase5a-0-4a-6

      - name: Phase 5A-0-4b main-tab snapshot/navigation tests
        run: npm run test:phase5a-0-4b

      - name: Phase 5A-1a Objective opportunity contract tests
        run: npm run test:phase5a-1a

      - name: Phase 5A-1b Objective opportunity RPC foundation tests
        run: npm run test:phase5a-1b

      - name: Phase 5A-1c Objective recovery and historical compatibility tests
        run: npm run test:phase5a-1c

      - name: Phase 5A-2a Objective runtime adapter tests
        run: npm run test:phase5a-2a

      - name: Phase 5A-2a isolated PostgreSQL migration and routing tests
        env:
          STUDY_GRAPH_ISOLATED_DB: "1"
          STUDY_GRAPH_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
        run: npm run test:phase5a-2a:db

      - name: Phase 5A archive conflict-target regression guard
        run: npm run test:phase5a-archive-conflict-target

      - name: Phase 5A archive conflict-target isolated PostgreSQL regression
        env:
          STUDY_GRAPH_ISOLATED_DB: "1"
          STUDY_GRAPH_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
        run: npm run test:phase5a-archive-conflict-target:db

      - name: Phase 5A-3a.1 project-neutral immutable content contract tests
        run: npm run test:phase5a-3a-1

      - name: Phase 5A-3a generic Objective archive contract tests
        run: npm run test:phase5a-3a

      - name: Phase 5A-3a isolated PostgreSQL generic archive regression
        env:
          STUDY_GRAPH_ISOLATED_DB: "1"
          STUDY_GRAPH_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/postgres
        run: npm run test:phase5a-3a:db

      - name: Phase 5A-2b online Objective cutover wiring tests
        run: npm run test:phase5a-2b

      - name: Phase 5A-3b Western Philosophy Objective v2 pilot tests
        run: npm run test:phase5a-3b

      - name: Phase 5A-3c Western Philosophy multi-Objective tests
        run: npm run test:phase5a-3c

      - name: Phase 5A-3d Western Art History Objective v2 pilot tests
        run: npm run test:phase5a-3d

      - name: Phase 5A-3e Western Art History multi-Objective tests
        run: npm run test:phase5a-3e

      - name: Phase 5A-3f Western Art History Lecture 1 Objective tests
        run: npm run test:phase5a-3f

      - name: TypeScript noEmit
        run: npx tsc --noEmit

      - name: Diff check
        run: git diff --check

      - name: Build
        run: npm run build

