name: Issue 73 Publish Kuzushiji v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/issue73-publish-kuzushiji-v2.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke the one-shot Production POST route
        shell: bash
        run: |
          set -euo pipefail
          url="https://study-graph-five.vercel.app/api/internal/issue73-P4x9Vm2Qk7Ls5Tn8Rc1Wd6Fh3Jz0Bg"
          code=""
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "$url" || true)"
            if [ "$code" = "405" ]; then
              break
            fi
            sleep 5
          done
          if [ "$code" != "405" ]; then
            echo "Production POST route did not become ready; last GET status=$code"
            exit 1
          fi

          response="$(mktemp)"
          post_code="$(curl -sS -o "$response" -w "%{http_code}" -X POST "$url")"
          cat "$response"
          echo
          test "$post_code" = "200"
          grep -q '"ok":true' "$response"
